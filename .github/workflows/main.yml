name: Build Release ZIP

permissions:
  contents: write

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create ZIP
        run: |
          zip -r qidong_water.zip custom_components/qidong_water \
            -x "*.git*" \
            -x ".github/*"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: qidong_water.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
